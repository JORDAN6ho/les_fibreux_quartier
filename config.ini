# Configuration réseau du quartier connecté (lue par serveur.py et client.py)
# Les options --hote et --port de la ligne de commande passent avant ce fichier.

[reseau]
# Adresse d'écoute du serveur : 0.0.0.0 = toutes les interfaces de la VM 1
hote_serveur = 0.0.0.0
# Adresse de la VM 1, vue depuis la VM 2 (à remplacer par le résultat de « hostname -I » sur la VM 1)
hote_client = 127.0.0.1
# Port TCP commun au serveur et au client
port = 5050

[base]
# Fichier sqlite3 des trajets d'ambulance, créé par le serveur
chemin = stats.db
